<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Check — Administração</title><link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="admin-shell">
<section id="login-view" class="panel login-panel">
  <div class="brand">TECH<span>CHECK</span></div><h1>Painel administrativo</h1><p>Acesso restrito.</p>
  <form id="login-form"><input id="email" type="email" placeholder="Seu e-mail" autocomplete="email" required><input id="password" type="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button></form>
  <p id="login-error" class="error"></p>
</section>
<section id="dashboard-view" hidden>
<header class="admin-header"><div><div class="brand">TECH<span>CHECK</span></div><h1>Painel administrativo</h1><p id="dashboard-updated" class="updated">—</p></div><div class="header-actions"><button id="refresh" class="secondary">Atualizar</button><button id="logout" class="secondary">Sair</button></div></header>
<div class="stats" id="stats"></div>
<section class="panel"><div class="section-head"><div><h2>Posts</h2><p id="post-count">Carregando matérias...</p></div><div class="post-filters"><input id="post-search" placeholder="Pesquisar post..." autocomplete="off"><select id="status-filter" aria-label="Filtrar por status"><option value="all">Todos os status</option><option value="review">Publicados</option><option value="draft">Rascunhos</option><option value="archived">Arquivados</option></select></div></div><div id="posts" class="posts"></div></section>
</section>
</main><script src="admin.js"></script>
</body></html>
