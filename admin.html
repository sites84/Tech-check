<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Check — Administração</title><link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="admin-shell">
<section id="login-view" class="panel login-panel">
  <div class="brand">TECH<span>CHECK</span></div><h1>Painel administrativo</h1><p>Acesso restrito.</p>
  <form id="login-form"><input id="email" type="email" placeholder="Seu e-mail" autocomplete="email" required><input id="password" type="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button></form>
  <p id="login-error" class="error"></p>
</section>
<section id="dashboard-view" hidden>
<header class="admin-header"><div><div class="brand">TECH<span>CHECK</span></div><h1>Painel administrativo</h1></div><button id="logout" class="secondary">Sair</button></header>
<div class="stats" id="stats"></div>
<section class="panel"><div class="section-head"><div><h2>Posts</h2><p>Gerencie as matérias publicadas no site.</p></div><input id="post-search" placeholder="Pesquisar post..."></div><div id="posts" class="posts"></div></section>
</section>
</main><script src="admin.js"></script>
</body></html>
