name: Atualizar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar RSS e salvar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node worker/collect-and-store.mjs

      - name: Processar notícias com Gemini
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: node worker/process-ai.mjs

      - name: Salvar relatórios
        run: |
          git config user.name "Tech Check Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection-report.json data/ai-processing-report.json
          git diff --cached --quiet || git commit -m "chore: registrar processamento editorial"
          git push
