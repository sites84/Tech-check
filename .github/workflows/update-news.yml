name: Atualizar notícias

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Coletar RSS e salvar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node worker/collect-and-store.mjs

      - name: Processar notícias com Gemini
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: node worker/process-ai.mjs

      - name: Buscar imagens dos produtos afiliados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node worker/update-affiliate-images.mjs

      - name: Gerar SEO, páginas individuais e imagens otimizadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p .seo-tools
          npm install --prefix .seo-tools --no-save sharp@0.33.5
          NODE_PATH="$GITHUB_WORKSPACE/.seo-tools/node_modules" node worker/generate-seo.mjs

      - name: Salvar relatórios, feed público e SEO
        if: always()
        run: |
          git config user.name "Tech Check Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection-report.json data/ai-processing-report.json data/latest.json data/seo-report.json sitemap.xml robots.txt noticias assets/news article-page.css worker/generate-seo.mjs .github/workflows/update-news.yml
          git diff --cached --quiet || git commit -m "chore: atualizar feed e SEO"
          git push
