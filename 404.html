<title>Página não encontrada — Tech Check</title>
<link rel="icon" href="/Tech-check/favicon.ico" sizes="any">

<style>
.error-page{min-height:70vh;display:grid;place-items:center;text-align:center;padding:48px 20px}.error-page-inner{max-width:680px}.error-code{font-size:clamp(4rem,14vw,9rem);line-height:.9;margin:0 0 16px}.error-page h1{margin:0 0 12px}.error-page p{margin:0 auto 24px;max-width:560px}.error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.error-actions a{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;text-decoration:none}.error-actions .primary{background:var(--accent,#6c63ff);color:#fff}.error-actions .secondary{border:1px solid currentColor;color:inherit}.error-search{margin:24px auto 0;display:flex;max-width:560px;gap:8px}.error-search input{flex:1;padding:12px;border-radius:10px;border:1px solid #888;background:transparent;color:inherit}.error-search button{padding:12px 16px;border:0;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="/Tech-check/">TECH<span>CHECK</span></a></div></header>
<main class="error-page"><div class="error-page-inner">
<p class="eyebrow">ERRO 404</p><p class="error-code" aria-hidden="true">404</p>
<h1>Página não encontrada</h1>
<p>A página que você tentou acessar não existe ou pode ter sido movida. Você pode voltar para a página inicial ou pesquisar uma notícia.</p>

<form class="error-search" action="/Tech-check/" method="get"><input name="q" type="search" placeholder="Pesquisar no Tech Check" aria-label="Pesquisar no Tech Check"><button type="submit">Pesquisar</button></form>
</div></main>
<script>document.documentElement.classList.add('js-404');</script>
</body>
</html>
